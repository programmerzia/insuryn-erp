# Design §9.1 DECISION: CI blocks merge on every test layer except the performance smoke. Make the `backend` and `frontend` jobs
# required status checks in the branch protection of `main`. Each job only calls scripts/ci/*.sh, so any CI runs the same steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/ci/frontend.sh

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      # Slice R8 (D-34): generated PDFs are printed by headless Chrome; ubuntu-24.04 runners ship it here, and ChromePdfRendererTest renders for real.
      ERP_CHROME_BINARY: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, bcmath, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Prepare database
        run: scripts/ci/prepare-database.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: scripts/ci/backend.sh
