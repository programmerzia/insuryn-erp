services:
  postgres:
    image: postgres:17
    environment:
      # Bootstrap superuser only. database/init creates the non-superuser erp_owner / erp_app roles
      # and the erp / erp_test databases; the application never connects as postgres.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["${ERP_DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    ports: ["${ERP_REDIS_PORT:-6379}:6379"]
volumes:
  pgdata:
